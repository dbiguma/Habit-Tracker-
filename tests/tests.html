<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker Tests</title>
  <style>
    :root { color-scheme: light dark; --good: #1b7f3b; --bad: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --good: #5fd38a; --bad: #ff8a80; } }
    body { font: 16px/1.5 -apple-system, system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; }
    h1 { margin-bottom: 4px; }
    #summary { font-size: 22px; font-weight: 700; }
    ul { list-style: none; padding: 0; }
    li { padding: 4px 0; border-bottom: 1px solid rgba(128, 128, 128, 0.2); }
    .good { color: var(--good); } .bad { color: var(--bad); }
  </style>
</head>
<body>
  <h1>Habit Tracker: math checks</h1>
  <p id="tz"></p>
  <p id="summary">Running…</p>
  <ul id="results"></ul>
  <script type="module" src="tests.js"></script>
</body>
</html>
